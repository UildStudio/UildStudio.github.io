<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面跳转中...</title>
    <meta http-equiv="refresh" content="0; url=https://weilanfurry.github.io/">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .link:hover {
            background: white;
            color: #2575fc;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .countdown {
            font-size: 1.1rem;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h1>页面跳转中...</h1>
        <p>您即将被自动跳转到目标页面。如果跳转没有发生，请点击下方按钮。</p>
        <div class="countdown" id="countdown">正在跳转...</div>
        <a href="https://weilanfurry.github.io/" class="link">手动跳转</a>
    </div>

    <script>
        // 备用的JavaScript跳转方法
        window.onload = function() {
            // 如果3秒后页面仍未跳转，使用JavaScript跳转
            setTimeout(function() {
                window.location.href = "https://weilanfurry.github.io/";
            }, 3000);
            
            // 倒计时显示
            let countdownEl = document.getElementById('countdown');
            let seconds = 3;
            
            let countdownInterval = setInterval(function() {
                seconds--;
                if (seconds > 0) {
                    countdownEl.textContent = `如果页面没有自动跳转，将在 ${seconds} 秒后跳转...`;
                } else {
                    countdownEl.textContent = "正在跳转...";
                    clearInterval(countdownInterval);
                }
            }, 1000);
        };
    </script>
</body>
</html>
